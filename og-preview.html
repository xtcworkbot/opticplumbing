<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OPS — OG Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,700;0,800;1,800&family=Saira+Condensed:wght@700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{ width:1200px; height:630px; overflow:hidden; background:#04080F; font-family:'Manrope',sans-serif; color:#fff;}
  .stage{
    position:relative; width:1200px; height:630px;
    background:
      radial-gradient(900px 500px at 90% 20%, rgba(46,120,200,.20), transparent 60%),
      radial-gradient(700px 400px at 0% 100%, rgba(232,58,58,.10), transparent 60%),
      linear-gradient(135deg, #050A14 0%, #070D18 40%, #050912 100%);
    overflow:hidden;
  }
  .bg-photo{
    position:absolute; right:-60px; top:-40px; width:780px; height:710px;
    background-image: url('assets/IMG_2232.JPG');
    background-size: cover; background-position: center;
    filter: brightness(.55) saturate(.9);
    mask-image: radial-gradient(ellipse at right, #000 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at right, #000 30%, transparent 78%);
  }
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(120,160,210,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,160,210,.06) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity:.4;
  }
  .noise{
    position:absolute; inset:0; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
  }
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(5,10,20,.95) 0%, rgba(5,10,20,.75) 45%, rgba(5,10,20,.45) 100%);
  }
  .content{
    position:relative; z-index:5;
    height:100%; padding: 70px 80px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{ display:flex; align-items:center; justify-content:space-between; }
  .logo-lockup{ display:flex; align-items:center; gap:18px; }
  .logo-lockup img{ width:96px; height:auto; }
  .name{ font-family:'Saira Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1; letter-spacing:.02em; text-transform:uppercase; color:#fff;}
  .sub{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:#5BA8E8; margin-top:6px;}
  .rank-pill{
    display:inline-flex; align-items:center; gap:12px;
    padding: 12px 22px;
    background: linear-gradient(180deg, rgba(232,58,58,.22), rgba(232,58,58,.08));
    border: 1.5px solid rgba(232,58,58,.5);
    color: #FFD9D9;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.28em; text-transform:uppercase;
    border-radius: 999px;
    box-shadow: 0 0 30px -8px rgba(232,58,58,.6);
  }
  .stars{ color: #FFD27A; letter-spacing: 1px; font-size: 16px;}

  .mid{ max-width: 750px; }
  .h1{
    font-family:'Saira', sans-serif; font-style:italic; font-weight:800;
    font-size: 86px; line-height:.9; letter-spacing:-0.02em;
    color:#fff;
  }
  .chrome{
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D2DD 40%, #5C6878 55%, #E5EAF2 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .h1-sub{
    margin-top: 22px;
    font-family:'Manrope', sans-serif; font-weight:500;
    font-size: 22px; line-height:1.4; color: #C9E1F5; max-width: 640px;
  }

  .bottom{ display:flex; align-items:center; justify-content:space-between; gap:30px;}
  .phone-cta{
    display:inline-flex; align-items:center; gap:14px;
    padding: 18px 28px;
    background: linear-gradient(180deg, #E83A3A 0%, #8E1A1A 100%);
    border: 1.5px solid #FF6868;
    color:#fff; font-family:'Saira', sans-serif; font-weight:800; font-style:italic;
    letter-spacing:.06em; text-transform:uppercase; font-size:22px;
    border-radius: 8px;
    box-shadow: 0 18px 36px -14px rgba(232,58,58,.55);
  }
  .meta-row{ display:flex; gap:18px; }
  .meta-pill{
    display:inline-flex; align-items:center; gap:10px;
    padding: 12px 18px;
    background: rgba(20,40,70,.55);
    border: 1px solid rgba(120,160,210,.28);
    border-radius: 999px;
    color: #C9E1F5;
    font-family:'Saira Condensed', sans-serif;
    font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-photo"></div>
    <div class="scrim"></div>
    <div class="grid-bg"></div>
    <div class="noise"></div>

    <div class="content">
      <div class="top">
        <div class="logo-lockup">
          <img src="brand_assets/logo.png" alt="OPS"/>
          <div>
            <div class="name">Optic Plumbing</div>
            <div class="sub">Solutions · Concord NSW</div>
          </div>
        </div>
        <div class="rank-pill">
          <span class="stars">★★★★★</span>
          <span>Concord's #1 Plumber</span>
        </div>
      </div>

      <div class="mid">
        <div class="h1">
          24/7 Emergency<br/>
          <span class="chrome">Plumbing &amp; Drains</span>
        </div>
        <div class="h1-sub">
          Blocked drains, burst pipes &amp; hot water — answered around the clock by a licensed Concord plumber. Family-run · 15+ years.
        </div>
      </div>

      <div class="bottom">
        <div class="phone-cta">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2 1a12 12 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
          0451 766 576
        </div>
        <div class="meta-row">
          <span class="meta-pill">NSW Licensed</span>
          <span class="meta-pill">24/7 Emergency</span>
          <span class="meta-pill">Inner West Sydney</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
